[project]
name = "vjp_steering"
version = "0.1.0"
description = "VJP-delta activation steering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.6",
    "beartype>=0.20",
    "ipykernel>=6.29",
    "jupytext>=1.17",
    "nbconvert>=7.16",
    "numpy>=1.26",
    "openai>=1.82",
    "kaleido==0.2.1",
    "loguru>=0.7",
    "plotly>=6.0",
    "steering-lite @ git+https://github.com/wassname/steering-lite.git@0a064ba",
    "tabulate>=0.9",
    "transformers>=4.51",
    "modal>=1.5.4",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "8 days"
